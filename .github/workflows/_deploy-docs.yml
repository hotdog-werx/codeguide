name: deploy-docs

on:
  workflow_call:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-docs:
    runs-on: ubuntu-latest
    outputs:
      has-docs: ${{ steps.check-docs.outputs.has-docs }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: check-docs-folder
        id: check-docs
        run: |
          if [ -d "docs" ]; then
            echo "has-docs=true" >> $GITHUB_OUTPUT
          else
            echo "has-docs=false" >> $GITHUB_OUTPUT
            echo "No docs folder found, skipping documentation deployment"
          fi

  build-and-deploy:
    needs: check-docs
    if: needs.check-docs.outputs.has-docs == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup-uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.11
          activate-environment: true
      - name: mise
        uses: jdx/mise-action@v3
      - name: poe
        run: uv tool install poethepoet
      - name: dependencies
        run: uvx --from poethepoet poe uv-sync
      - name: check-python
        run: poe check-python
      - name: build-docs
        run: poe build-docs
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: run-checks

on:
  workflow_call:
    inputs:
      operating-systems:
        description: 'JSON array of operating systems to run checks on'
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.operating-systems) }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
      - name: mise
        uses: jdx/mise-action@v3
      - name: dependencies
        run: poe uv-sync

      - name: check-docs-folder
        id: check-docs
        shell: bash
        run: |
          HAS_DOCS=$([ -d "docs" ] && echo "true" || echo "false")
          echo "has-docs=$HAS_DOCS" >> "$GITHUB_OUTPUT"
          echo "Documentation folder exists: $HAS_DOCS"

      - name: check-dprint
        run: poe check-dprint
      - name: check-python
        run: poe check-python
      - name: check-basedpyright
        run: poe check-basedpyright
      - name: check-complexity
        run: poe check-complexity
      - name: check-coverage
        run: poe check-coverage
      - name: build-docs
        if: steps.check-docs.outputs.has-docs == 'true'
        run: poe build-docs
      - name: check-repolish
        run: poe check-repolish

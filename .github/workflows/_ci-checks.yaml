name: run-checks

on:
  workflow_call:
    inputs:
      operating-systems:
        description: 'JSON array of operating systems to run checks on'
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.operating-systems) }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
      - name: mise
        uses: jdx/mise-action@v3
      - name: dependencies
        run: poe uv-sync

      - name: check-project-features
        id: check-features
        shell: bash
        run: |
          HAS_DOCS=$([ -d "docs" ] && echo "true" || echo "false")
          echo "has-docs=$HAS_DOCS" >> "$GITHUB_OUTPUT"
          echo "Documentation folder exists: $HAS_DOCS"

          HAS_PYTHON=$([ -f "pyproject.toml" ] && grep -q "\[build-system\]" pyproject.toml && echo "true" || echo "false")
          echo "has-python=$HAS_PYTHON" >> "$GITHUB_OUTPUT"
          echo "Python build system detected: $HAS_PYTHON"

      - name: check-dprint
        run: poe check-dprint
      - name: check-python
        if: steps.check-features.outputs.has-python == 'true'
        run: poe check-python
      - name: check-ty
        if: steps.check-features.outputs.has-python == 'true'
        run: poe check-ty
      - name: check-complexity
        if: steps.check-features.outputs.has-python == 'true'
        run: poe check-complexity
      - name: check-coverage
        if: steps.check-features.outputs.has-python == 'true'
        run: poe check-coverage
      - name: build-docs
        if: steps.check-features.outputs.has-docs == 'true'
        run: poe build-docs
      # - name: check-repolish
      #   run: poe check-repolish

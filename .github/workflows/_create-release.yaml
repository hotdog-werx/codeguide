name: create-release

on:
  workflow_call:
    inputs:
      build-command:
        description: 'command to execute to build the project'
        required: false
        type: string
        default: 'poe build'
      publish-command:
        description: 'command to execute to publish the package'
        required: false
        type: string
        default: 'poe publish'
    secrets:
      PYPI_TOKEN:
        description: 'PyPI API token for publishing packages'
        required: false
      github-token:
        description: 'GitHub token for creating releases'
        required: false

permissions:
  contents: write
  pull-requests: read

jobs:
  github-release:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.releez.outputs.release-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
      - name: mise
        uses: jdx/mise-action@v3
      - name: dependencies
        run: poe uv-sync

      - name: get-releez-version
        id: get-releez-version
        run: |
          RELEEZ_VERSION=$(mise ls --json | jq -r '.["pipx:hotdog-werx/releez"][0].version')
          echo "version=$RELEEZ_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releez version: $RELEEZ_VERSION"

      - name: releez-finalize
        id: releez
        uses: hotdog-werx/releez-finalize-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          RELEEZ_GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        with:
          github-token: ${{ secrets.github-token || github.token }}
          releez-version: ${{ steps.get-releez-version.outputs.version }}

      - name: enhance-release-notes
        id: enhance-notes
        shell: python
        env:
          NOTES: ${{ steps.releez.outputs.release-notes }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          import os
          notes = os.environ['NOTES']
          pr_number = os.environ['PR_NUMBER']
          repo = os.environ['GITHUB_REPOSITORY']
          pr_link = f'https://github.com/{repo}/pull/{pr_number}'
          enhanced_notes = f'{notes}\n\n---\nAutomated release triggered by [#{pr_number}]({pr_link})'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('enhanced-notes<<EOF\n')
              f.write(enhanced_notes)
              f.write('\nEOF\n')

      - name: create-github-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.releez.outputs.release-version }}
          body: ${{ steps.enhance-notes.outputs.enhanced-notes }}

      - name: regenerate-changelog
        env:
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          RELEEZ_GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: mise exec -- releez changelog regenerate

      - name: commit-changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(ci): regenerate changelog after release [skip ci]'
          branch: ${{ github.event.pull_request.base.ref }}
          file_pattern: 'CHANGELOG.md'

  build-publish:
    if: inputs.build-command != '' || inputs.publish-command != ''
    needs: github-release
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
      - name: mise
        uses: jdx/mise-action@v3
      - name: dependencies
        run: poe uv-sync

      - name: expose-version
        run: |
          {
            echo "IS_RELEASE=true"
            echo "VERSION=${{ needs.github-release.outputs.release-version }}"
          } >> "$GITHUB_ENV"

      - name: build-project
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: publish-package
        if: inputs.publish-command != ''
        run: ${{ inputs.publish-command }}

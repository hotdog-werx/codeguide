name: create-release

on:
  workflow_call:
    inputs:
      build-command:
        description: 'command to execute to build the project'
        required: false
        type: string
        default: 'poe build'
      publish-command:
        description: 'command to execute to publish the package'
        required: false
        type: string
        default: 'poe publish'
    secrets:
      PYPI_TOKEN:
        description: 'PyPI API token for publishing packages'
        required: false
      github-token:
        description: 'GitHub token for creating releases'
        required: false

permissions:
  contents: write
  pull-requests: read

jobs:
  github-release:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.releez.outputs.release-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.11
          activate-environment: true

      - name: install-poethepoet
        run: uv tool install poethepoet

      - name: mise
        uses: jdx/mise-action@v3

      - name: get-releez-version
        id: get-releez-version
        run: |
          RELEEZ_VERSION=$(mise ls --json | jq -r '.["pipx:hotdog-werx/releez"][0].version')
          echo "version=$RELEEZ_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releez version: $RELEEZ_VERSION"

      - name: releez-finalize
        id: releez
        uses: hotdog-werx/releez-finalize-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          RELEEZ_GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        with:
          github-token: ${{ secrets.github-token || github.token }}
          releez-version: ${{ steps.get-releez-version.outputs.version }}

      - name: enhance-release-notes
        id: enhance-notes
        env:
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
        run: |
          NOTES="${{ steps.releez.outputs.release-notes }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_LINK="https://github.com/${{ github.repository }}/pull/${PR_NUMBER}"
          ENHANCED_NOTES="${NOTES}\n\n---\nAutomated release triggered by [#${PR_NUMBER}](${PR_LINK})"
          echo "enhanced-notes<<EOF" >> $GITHUB_OUTPUT
          echo -e "${ENHANCED_NOTES}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: create-github-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.releez.outputs.release-version }}
          body: ${{ steps.enhance-notes.outputs.enhanced-notes }}

      - name: debug-releez-installation
        run: |
          mise which releez || echo "releez not found in mise"
          ls -la /home/runner/.local/share/mise/installs/pipx-hotdog-werx-releez/topic-changelog-regen/ || echo "directory doesn't exist"
          find /home/runner/.local/share/mise/installs/ -name "releez" -type f 2>/dev/null || echo "no releez binary found"

      - name: regenerate-changelog
        env:
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          RELEEZ_GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: mise exec -- releez changelog regenerate

      - name: commit-changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(ci): regenerate changelog after release [skip ci]'
          branch: ${{ github.event.pull_request.base.ref }}
          file_pattern: 'CHANGELOG.md'

  build-publish:
    if: inputs.build-command != '' || inputs.publish-command != ''
    needs: github-release
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.11
          activate-environment: true

      - name: mise
        uses: jdx/mise-action@v3

      - name: install-poethepoet
        run: uv tool install poethepoet

      - name: expose-version
        run: |
          {
            echo "IS_RELEASE=true"
            echo "VERSION=${{ needs.github-release.outputs.release-version }}"
          } >> $GITHUB_ENV

      - name: debug-poe-installation
        run: |
          echo "=== Checking mise poe installation ==="
          ls -la /home/runner/.local/share/mise/installs/pipx-poethepoet/0.36.0/bin/ || echo "bin directory doesn't exist"
          if [ -f /home/runner/.local/share/mise/installs/pipx-poethepoet/0.36.0/bin/poe ]; then
            echo "=== poe binary exists, checking shebang ==="
            head -1 /home/runner/.local/share/mise/installs/pipx-poethepoet/0.36.0/bin/poe
            echo "=== Checking if interpreter exists ==="
            SHEBANG=$(head -1 /home/runner/.local/share/mise/installs/pipx-poethepoet/0.36.0/bin/poe | sed 's/#!//')
            ls -la "$SHEBANG" || echo "Shebang interpreter doesn't exist"
            echo "=== Checking final python target ==="
            ls -la /home/runner/.local/share/uv/python/cpython-3.11.14-linux-x86_64-gnu/bin/python3.11 || echo "Final python doesn't exist"
            echo "=== Trying to execute python directly ==="
            /home/runner/.local/share/uv/python/cpython-3.11.14-linux-x86_64-gnu/bin/python3.11 --version || echo "Can't execute python"
          fi
          echo "=== Checking PATH ==="
          echo "$PATH"
          echo "=== All poe executables in PATH ==="
          which -a poe || echo "No poe found"

      - name: build-project
        if: inputs.build-command != ''
        env:
          MISE_VERBOSE: '1'
        run: ${{ inputs.build-command }}

      - name: publish-package
        if: inputs.publish-command != ''
        env:
          MISE_VERBOSE: '1'
        run: ${{ inputs.publish-command }}

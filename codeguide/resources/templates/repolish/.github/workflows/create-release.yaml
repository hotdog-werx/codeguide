# generated by hotdog-werx/codeguide - manual changes will be overwritten
name: create-release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  pull-requests: read

jobs:
  github-release:
    uses: hotdog-werx/codeguide/.github/workflows/_create-release.yaml@{{ cookiecutter.codeguide_ref }}
    secrets: inherit
{%- if cookiecutter.release_commands.values() | reject('none') | list | length > 0 %}
    with:
{%- for key, value in cookiecutter.release_commands | dictsort %}
{%- if value is not none %}
      {{ key }}-command: '{{ value }}'
{%- endif %}
{%- endfor %}
{%- endif %}

## repolish-regex[additional-jobs]: ^## post-release jobs([\s\S]*)$
## post-release jobs - add your custom jobs here
